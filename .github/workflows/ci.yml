name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Install dependencies and generate lockfile when needed
        run: yarn install --no-immutable
      - name: Preserve generated lockfile as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-yarn-lockfile
          path: yarn.lock
          if-no-files-found: error
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn test
      - run: yarn build
      - name: Install Chromium and system dependencies
        run: yarn playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: yarn test:e2e
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14